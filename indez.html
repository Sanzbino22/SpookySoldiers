<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpookySoldiers AR</title>

  <!-- Google <model-viewer> library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    /* Custom AR Button overlay */
    .ar-button {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .ar-button:active {
      transform: translateX(-50%) scale(0.98);
    }
  </style>
</head>
<body>

  <model-viewer 
    src="Spookyfamily-v1.glb" 
    alt="Spooky Soldiers 3D Model"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    shadow-softness="1"
    auto-rotate>
    
    <button slot="ar-button" class="ar-button">
      📱 View in your space
    </button>

  </model-viewer>

</body>
</html>
