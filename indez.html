<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpookySoldiers AR</title>
  
  <!-- 1. Load Google's model-viewer script -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    .ar-button {
      background-color: #ffffff;
      border-radius: 20px;
      border: none;
      color: #1a1a1a;
      padding: 12px 24px;
      font-weight: bold;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 2. Configure model-viewer with your GLB file -->
  <model-viewer 
    src="Spookyfamily-v1.glb" 
    alt="Spooky Soldiers 3D Model"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    auto-rotate>
    
    <button slot="ar-button" class="ar-button">
      👋 View in AR
    </button>

  </model-viewer>

</body>
</html>
