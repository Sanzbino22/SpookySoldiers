<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spooky Soldiers AR</title>
  <!-- Load the <model-viewer> library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    .ar-button {
      background-color: #ffffff;
      border-radius: 4px;
      border: 1px solid #dadce0;
      color: #4285f4;
      padding: 10px 20px;
      font-weight: 500;
      position: absolute;
      bottom: 20px;
      right: 20px;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="Spookyfamily-v1.glb" 
    alt="Spooky Family 3D Model"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    auto-rotate>
    
    <button slot="ar-button" class="ar-button">
      👋 View in your space
    </button>

  </model-viewer>

</body>
</html>
